{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راديو نبرة - قريباً</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        
        @keyframes pulse-wave {
            0% { box-shadow: 0 0 0 0 rgba(203, 163, 88, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(203, 163, 88, 0); }
            100% { box-shadow: 0 0 0 0 rgba(203, 163, 88, 0); }
        }
        .animate-pulse-wave {
            animation: pulse-wave 2.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-500">

    <!-- تأثيرات الإضاءة في الخلفية -->
    <div class="absolute top-[-15%] left-[-10%] w-96 h-96 bg-[#cba358] rounded-full mix-blend-multiply filter blur-[128px] opacity-20 dark:opacity-10 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-gray-400 dark:bg-gray-700 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 dark:opacity-30 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="z-10 text-center px-4 max-w-2xl mx-auto w-full">
        
        <!-- اللوجو مع تأثير الموجات -->
        <div class="flex justify-center mb-8 pt-10">
            <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-full overflow-hidden border-2 border-[#cba358] bg-white animate-pulse-wave relative z-20">
                <img src="{% static 'images/main_logo.webp' %}" alt="لوجو راديو نبرة" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- العنوان -->
        <h1 class="text-4xl sm:text-6xl font-black mb-4 tracking-tighter drop-shadow-md">
            <span class="text-[#cba358]">راديو</span> نبرة
        </h1>
        
        <h2 class="text-xl sm:text-2xl font-bold mb-6 text-gray-700 dark:text-gray-300">
            صوت الصحافة للمقالات والبودكاست.. <span class="text-[#cba358] inline-block animate-bounce mt-2 sm:mt-0">قريباً جداً!</span>
        </h2>

        <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400 mb-10 leading-relaxed max-w-lg mx-auto">
            نعمل بشغف على تجهيز استوديوهات ومنصة "نبرة" لنقدم لكم تجربة صوتية ومقالية فريدة. اترك بريدك الإلكتروني لنخبرك فور انطلاقنا.
        </p>

        <!-- فورم تسجيل الإيميل -->
        <form class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto mb-14 relative z-20" onsubmit="event.preventDefault(); alert('تم تسجيل بريدك بنجاح! سنخبرك فور الانطلاق.');">
            <input type="email" placeholder="أدخل بريدك الإلكتروني..." required
                class="flex-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3.5 text-sm sm:text-base focus:outline-none focus:border-[#cba358] focus:ring-1 focus:ring-[#cba358] transition-all text-gray-900 dark:text-white shadow-sm">
            <button type="submit"
                class="bg-[#cba358] hover:bg-[#b8914b] text-white font-bold py-3.5 px-6 rounded-xl transition-all duration-300 shadow-md hover:shadow-lg hover:-translate-y-0.5 flex items-center justify-center gap-2">
                <span>أعلمني</span>
                <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>

        <!-- روابط التواصل -->
        <div class="flex justify-center items-center gap-6 text-gray-400 dark:text-gray-500 relative z-20 pb-10">
            <a href="https://www.facebook.com/RadioNabra/" target="_blank" class="hover:text-[#cba358] dark:hover:text-[#cba358] transition transform hover:scale-125" aria-label="Facebook">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35C.597 0 0 .597 0 1.325v21.351C0 23.403.597 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.597 1.323-1.324V1.325C24 .597 23.403 0 22.675 0z"/></svg>
            </a>
            <a href="https://wa.me/201017485038" target="_blank" class="hover:text-[#cba358] dark:hover:text-[#cba358] transition transform hover:scale-125" aria-label="WhatsApp">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            </a>
        </div>
        
    </div>
</body>
</html>
