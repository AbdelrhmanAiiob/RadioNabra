        </div>
        <div class="font-medium tracking-wide">صوت الصحافة للمقالات والبودكاست</div>
    </div>
</div>

<!-- Main Navbar -->
<nav class="bg-white shadow-xs sticky top-0 z-50 w-full overflow-x-hidden border-b border-gray-100">
    <div class="container mx-auto px-3 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-14 sm:h-16">
            
            <!-- Left Side -->
            <div class="flex items-center gap-3">
                <!-- Hamburger Button for Mobile -->
                <button id="menu-toggle" class="lg:hidden text-gray-600 hover:text-[#cba358] focus:outline-none p-1" type="button" title="Menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>

                <!-- Logo Section -->
                <div class="flex-shrink-0 flex items-center">
                    <!-- اللينك بيضم الصورة والنص مع بعض -->
                    <a href="{% url 'articles:list' %}" class="group flex items-center gap-2 sm:gap-3 transition">
                        
                        <!-- اللوجو (هيظهر على اليمين) -->
                        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-full overflow-hidden shadow-sm border border-gray-100 group-hover:shadow-md group-hover:scale-105 transition-all duration-300">
                            <img src="{% static 'images/main_logo.webp' %}" alt="لوجو راديو نبرة" class="w-full h-full object-cover">
                        </div>
                        
                        <!-- النص (هيظهر على الشمال) -->
                        <div class="text-lg sm:text-2xl font-black text-gray-800 tracking-tighter group-hover:text-[#cba358] transition duration-300 flex items-center gap-1">
                            <span class="text-[#cba358]">راديو</span> نبرة
                        </div>

                    </a>
                </div>
            </div>
            
            <!-- Desktop Links -->
            <div class="hidden lg:flex space-x-6 space-x-reverse items-center text-xs font-semibold">
                <a href="{% url 'articles:list' %}" class="text-[#cba358] font-bold border-b-2 border-[#cba358] pb-0.5">الرئيسية</a>
                <a href="#" class="text-gray-600 hover:text-[#cba358] transition">الأخبار</a>
                <a href="#" class="text-gray-600 hover:text-[#cba358] transition">البودكاست</a>
                <a href="#" class="text-gray-600 hover:text-[#cba358] transition">مقالات</a>
                <a href="mailto:radionabra@gmail.com" class="text-gray-600 hover:text-[#cba358] transition">تواصل معنا</a>
            </div>
            
            <!-- Search -->
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1.5 relative" id="search-wrapper">
                    <form action="{% url 'articles:list' %}" method="GET" id="search-form" class="overflow-hidden transition-all duration-300 ease-out w-0 opacity-0 flex items-center bg-gray-50 rounded-full border border-gray-200 py-0.5 px-2">
                        <input type="text" name="q" id="search-input" value="{{ request.GET.q|default:'' }}" class="bg-transparent text-gray-700 text-xs block w-24 sm:w-36 py-1 px-1 outline-none placeholder-gray-400" placeholder="ابحث...">
                    </form>
                    <button id="search-toggle" class="text-gray-400 hover:text-[#cba358] transition rounded-full shrink-0 p-1 bg-white relative z-10" type="button" title="Search">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white border-t border-gray-100 px-4 pt-3 pb-4 space-y-2 text-xs font-semibold shadow-lg">
        <a href="{% url 'articles:list' %}" class="block py-2 text-[#cba358] font-bold border-b border-gray-50">الرئيسية</a>
        <a href="#" class="block py-2 text-gray-600 hover:text-[#cba358] transition border-b border-gray-50">الأخبار</a>
        <a href="#" class="block py-2 text-gray-600 hover:text-[#cba358] transition border-b border-gray-50">البودكاست</a>
        <a href="#" class="block py-2 text-gray-600 hover:text-[#cba358] transition border-b border-gray-50">مقالات</a>
        <a href="mailto:radionabra@gmail.com" class="block py-2 text-gray-600 hover:text-[#cba358] transition">تواصل معنا</a>
    </div>
</nav>
