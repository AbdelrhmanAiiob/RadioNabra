{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
        } else {
            document.documentElement.classList.remove('dark-mode');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <meta name="author" content="Aiiob">
    <meta name="description" content="Advanced article platform built with Django">
    
  <!--
    ===========================================
    Built with ❤️ by [Abdelrhman Aiiob]
    Backend Developer: Python / Django
    Email: aiiob@icloud.com or abdelrhmanaiiob@gmail.com
    GitHub: https://github.com/AbdelrhmanAiiob
    ===========================================
  -->

    
    <title>{% block title %}{% endblock title %}</title>

    <!-- Site Logo -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="alternate icon" href="{% static 'images/favicon.svg' %}">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Tailwind CDN (Keep for dev, remove in production) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col min-h-screen bg-gray-100 text-gray-900 font-sans antialiased">

    {% include 'parts/navbar.html' %}

    <!-- Main Content -->
    <main class="flex-grow container mx-auto mt-10 px-4 mb-20">
        {% block content %}
        {% endblock content %}
    </main>

    {% include 'parts/footer.html' %}

    <!-- External JS -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
