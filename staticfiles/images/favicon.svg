<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>

    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#996B00"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#4A3300"/>
    </linearGradient>
    

    <radialGradient id="innerLight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.3"/>
    </radialGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>


  <circle cx="50" cy="50" r="46" fill="url(#gold3D)" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="46" fill="url(#innerLight)"/>
  <circle cx="50" cy="50" r="41" fill="#121212"/> 


  <rect x="36" y="18" width="28" height="42" rx="14" fill="url(#gold3D)" filter="url(#shadow)"/>
  <rect x="36" y="18" width="28" height="42" rx="14" fill="url(#innerLight)"/>

  <line x1="38" y1="28" x2="62" y2="28" stroke="#121212" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="38" x2="62" y2="38" stroke="#121212" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="48" x2="62" y2="48" stroke="#121212" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M 22 45 A 28 28 0 0 0 78 45" fill="none" stroke="url(#gold3D)" stroke-width="5" stroke-linecap="round" filter="url(#shadow)"/>
  <line x1="50" y1="73" x2="50" y2="86" stroke="url(#gold3D)" stroke-width="5" filter="url(#shadow)"/>
  <line x1="32" y1="86" x2="68" y2="86" stroke="url(#gold3D)" stroke-width="6" stroke-linecap="round" filter="url(#shadow)"/>
